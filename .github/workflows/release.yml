name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      # The changelog section for a release is written and committed before the tag is pushed
      # (scripts/update-changelog.sh <version> moves the [Unreleased] notes under the new version).
      # This job only reads it. Anything this job changed in the file would be lost with the
      # runner, so it checks here, before anything is published, that the section is there.
      - name: Check CHANGELOG.md has a section for this version
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          if grep -qF "## [v$VERSION]" CHANGELOG.md; then
            echo "Found the v$VERSION section in CHANGELOG.md"
          elif [[ "$VERSION" == *alpha* || "$VERSION" == *beta* || "$VERSION" == *rc* ]]; then
            echo "::warning::CHANGELOG.md has no section for pre-release v$VERSION. The release notes will only link to the changelog."
          else
            echo "::error::CHANGELOG.md has no '## [v$VERSION]' section. Run scripts/update-changelog.sh $VERSION, commit the result, and tag that commit."
            exit 1
          fi

      - name: Update version in gradle.properties
        run: |
          # Update version while preserving other properties
          sed -i "s/version=.*/version=${{ steps.extract_version.outputs.version }}/" plugin/gradle.properties
          echo "Updated gradle.properties:"
          cat plugin/gradle.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew plugin:build plugin:test --no-daemon --stacktrace

      - name: Validate plugin
        run: ./gradlew plugin:validatePlugin --no-daemon

      # --validate-only, not --dry-run: "publishPlugins --dry-run" published a version from CI
      # on 2026-10-14 (see test-release.yml). Pre-releases are validated, never published.
      - name: Validate publish metadata for pre-release (no publish)
        if: contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc')
        run: ./gradlew plugin:publishPlugins --validate-only --no-daemon
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Publish to Gradle Plugin Portal
        if: "!contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc')"
        run: ./gradlew plugin:publishPlugins --no-daemon
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Generate release notes from changelog
        id: changelog
        run: |
          # Extract the content between this version's header and the next version/section
          VERSION="${{ steps.extract_version.outputs.version }}"

          # Get the release notes from the tagged commit's CHANGELOG.md
          RELEASE_NOTES=$(awk -v version="$VERSION" '
            BEGIN { in_section = 0; content = "" }
            /^## \[v/ {
              if (in_section) exit
              if ($0 ~ "\\[v" version "\\]") {
                in_section = 1
                next
              }
            }
            /^## / && in_section { exit }
            in_section && !/^## / {
              if (content != "") content = content "\n"
              content = content $0
            }
            END { print content }
          ' CHANGELOG.md)

          if [ -z "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="Release v$VERSION - see CHANGELOG.md for details"
          fi

          # Save to output
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "## Release v$VERSION" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.extract_version.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          body: ${{ steps.changelog.outputs.changelog }}