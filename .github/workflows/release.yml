name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      # The changelog section for a release is written and committed before the tag is pushed
      # (scripts/update-changelog.sh <version> moves the [Unreleased] notes under the new version).
      # This job only reads it. Anything this job changed in the file would be lost with the
      # runner. The notes are read here, before anything is built or published, so that a final
      # release without notes stops early. A pre-release may go without them.
      - name: Read release notes from CHANGELOG.md
        id: changelog
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          # The lines between this version's header and the next "## " header
          RELEASE_NOTES=$(awk -v header="## [v$VERSION]" '
            /^## / {
              if (in_section) exit
              if (index($0, header) == 1) { in_section = 1; next }
            }
            in_section && (started || NF) { started = 1; print }
          ' CHANGELOG.md)

          if ! grep -q '[^[:space:]]' <<< "$RELEASE_NOTES"; then
            if [[ "$VERSION" == *alpha* || "$VERSION" == *beta* || "$VERSION" == *rc* ]]; then
              echo "::warning::CHANGELOG.md has no notes for pre-release v$VERSION. The release notes will only link to the changelog."
              RELEASE_NOTES="Release v$VERSION - see CHANGELOG.md for details"
            else
              echo "::error::CHANGELOG.md has no notes under a '## [v$VERSION]' header. Run scripts/update-changelog.sh $VERSION, commit the result, and tag that commit."
              exit 1
            fi
          fi

          {
            echo "changelog<<EOF"
            echo "## Release v$VERSION"
            echo ""
            echo "$RELEASE_NOTES"
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update version in gradle.properties
        run: |
          # Update version while preserving other properties
          sed -i "s/version=.*/version=${{ steps.extract_version.outputs.version }}/" plugin/gradle.properties
          echo "Updated gradle.properties:"
          cat plugin/gradle.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew plugin:build plugin:test --no-daemon --stacktrace

      - name: Validate plugin
        run: ./gradlew plugin:validatePlugin --no-daemon

      # --validate-only, not --dry-run: "publishPlugins --dry-run" published a version from CI
      # on 2026-10-14 (see test-release.yml). Pre-releases are validated, never published.
      - name: Validate publish metadata for pre-release (no publish)
        if: contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc')
        run: ./gradlew plugin:publishPlugins --validate-only --no-daemon
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Publish to Gradle Plugin Portal
        if: "!contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc')"
        run: ./gradlew plugin:publishPlugins --no-daemon
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.extract_version.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          body: ${{ steps.changelog.outputs.changelog }}

  # update-docs-version.yml listens for "release: published", but a release created with the
  # workflow's own token does not start other workflows, so it never ran. It is started here
  # instead. This is a separate job so that the release job's token stays limited to "contents",
  # and so that a failure here comes after the publish and cannot stop it.
  update-docs-version:
    needs: release
    if: "!contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc')"
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the docs version update
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-docs-version.yml --repo "${{ github.repository }}" --ref main