name: Test Release Process

on:
  workflow_dispatch:
    inputs:
      test_version:
        description: 'Test version to simulate'
        required: true
        default: '0.1.0-test'

jobs:
  test-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Update version for testing
        run: |
          # Update version while preserving other properties
          sed -i "s/version=.*/version=${{ github.event.inputs.test_version }}/" plugin/gradle.properties
          echo "Testing with version: ${{ github.event.inputs.test_version }}"
          echo "Updated gradle.properties:"
          cat plugin/gradle.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew plugin:build plugin:test --no-daemon --stacktrace

      - name: Validate plugin
        run: ./gradlew plugin:validatePlugin --no-daemon

      # Do not use "publishPlugins --dry-run" here. On 2026-10-14 that exact command ran the task
      # in CI (run 38572347679) and published 2.2.4-test to the public Plugin Portal.
      # --validate-only is the publish plugin's own no-publish mode: it checks the plugin
      # metadata against the portal and never creates a version.
      - name: Validate publish metadata (no publish)
        run: ./gradlew plugin:publishPlugins --validate-only --no-daemon
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: test-build-${{ github.event.inputs.test_version }}
          path: plugin/build/libs/