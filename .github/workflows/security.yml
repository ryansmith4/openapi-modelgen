name: Security

on:
  schedule:
    # Run weekly security scans
    - cron: '0 0 * * 1'  # Every Monday at midnight UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

# CodeQL is handled by GitHub's default setup (repository Settings > Code security), not by this
# workflow. The previous CodeQL step called codeql-action/analyze without codeql-action/init and
# failed on every run. The previous update-actions job rewrote its own grep/sed patterns on every run
# and then failed to push; Dependabot's github-actions ecosystem (.github/dependabot.yml) covers that.
# The previous dependency-review job needs the Dependency graph enabled and, for Gradle, a
# dependency-submission job to populate it; neither exists yet, so it is not part of this workflow.

jobs:
  # OWASP Dependency-Check over the plugin's resolved dependencies, weekly and on demand.
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run OWASP Dependency Check
        run: |
          ./gradlew plugin:dependencyCheckAnalyze --no-daemon
        continue-on-error: true

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-report
          path: plugin/build/reports/dependency-check/
